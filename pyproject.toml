[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosense-ai-research"
version = "0.1.0"
description = "Offline stereo depth and confidence analysis utilities (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sobirova Ikboloy Ikrom Kizi"}]
dependencies = ["numpy>=1.24,<3"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Image Processing"]

[project.scripts]
neurosense-evaluate = "neurosense_ai.cli:main"

[project.optional-dependencies]
experiments = ["opencv-python>=4.8,<5", "scipy>=1.10", "matplotlib>=3.7"]
test = ["pytest>=7", "opencv-python-headless>=4.8,<5"]

[tool.setuptools.packages.find]
where = ["src"]
